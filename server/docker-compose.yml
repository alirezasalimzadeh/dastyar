# =============================================================================
# دستیار مشاور — سرور کامل (سایت + دیتابیس + احرازهویت) روی یک VPS
#
#   web (Caddy)  :80/:443
#     ├─ /           → سایت (static — dist ساخته‌شده روی لپ‌تاپ)
#     ├─ /rest/v1    → PostgREST (داده‌ها، با RLS چندکاربره)
#     └─ /auth/v1    → GoTrue (ثبت‌نام/ورود با ایمیل)
#   db (PostgreSQL 16) + کانتینرهای کمکی
#
# استفاده:
#   1) cp .env.example .env  (و مقادیر را پر کنید)
#   2) bash make-keys.sh     (کلیدهای JWT تولید و در .env ذخیره می‌شوند)
#   3) docker compose up -d --build
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: dastyar-db
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD در .env لازم است}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # احرازهویت — GoTrue (همان سیستم ثبت‌نام/ورود Supabase)
  auth:
    image: supabase/gotrue:v2.196.0
    container_name: dastyar-auth
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET در .env لازم است (make-keys.sh)}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_SITE_URL: ${SITE_URL:?SITE_URL در .env لازم است (آی‌پی یا دامنه سرور)}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # ایمیل تأیید ارسال نمی‌شود — ثبت‌نام بلافاصله فعال است:
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_LOG_LEVEL: info
    restart: unless-stopped

  # REST — PostgREST (API جدول‌ها، با RLS)
  rest:
    image: postgrest/postgrest:v14.17
    container_name: dastyar-rest
    depends_on:
      init-trigger:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      PGRST_DB_URI: postgresql://dastyar:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
    restart: unless-stopped

  # تریگر ثبت‌نام — بعد از ساخت auth.users توسط GoTrue (یک‌باره)
  init-trigger:
    image: postgres:16-alpine
    container_name: dastyar-init-trigger
    depends_on:
      - auth
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./schema:/sql:ro
      - ./schema/wait-and-init.sh:/init.sh:ro
    restart: "no"

  # وب — Caddy (سایت + پروکسی API)
  web:
    image: caddy:2-alpine
    container_name: dastyar-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/dastyar:ro
    depends_on:
      - auth
      - rest
    restart: unless-stopped

volumes:
  db-data:
